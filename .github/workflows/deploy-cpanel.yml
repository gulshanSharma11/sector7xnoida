name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tell cPanel to pull the latest commit
        run: |
          curl -fsS -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=${{ secrets.CPANEL_REPO_ROOT }}" \
            --data-urlencode "branch=main"

      - name: Tell cPanel to deploy (runs .cpanel.yml)
        run: |
          curl -fsS -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${{ secrets.CPANEL_REPO_ROOT }}"