---
deployment:
  tasks:
    - DEPLOYPATH=/home/sector7xnoida/public_html && mkdir -p "$DEPLOYPATH/assets" "$DEPLOYPATH/database" "$DEPLOYPATH/inc" "$DEPLOYPATH/pages"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp -RT assets "$DEPLOYPATH/assets"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp -RT database "$DEPLOYPATH/database"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp -RT pages "$DEPLOYPATH/pages"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp inc/admin_layout.php inc/bootstrap.php inc/config.sample.php inc/layout.php "$DEPLOYPATH/inc/"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp index.php "$DEPLOYPATH/"
    - DEPLOYPATH=/home/sector7xnoida/public_html && cp .htaccess "$DEPLOYPATH/"
